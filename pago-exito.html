<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso - IDMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #bbf7d0;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(22,163,74,0.12);
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(22,163,74,0.3);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #14532d;
      margin-bottom: 10px;
    }
    p {
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 13px 30px;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(22,163,74,0.35);
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-sec {
      display: inline-block;
      margin-top: 12px;
      color: #64748b;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .btn-sec:hover { color: #1e293b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">✓</div>
    <h1>¡Pago aprobado!</h1>
    <p id="successMsg">Tu pago fue procesado correctamente. Ya tienes acceso al curso. Dirígete a <strong>Mis Cursos</strong> para comenzar.</p>
    <a class="btn" id="successBtn" href="perfil.html#mis-cursos">Ir a Mis Cursos</a>
    <br>
    <a class="btn-sec" href="cursos.html">Explorar más cursos</a>
  </div>

  <script src="app.js" defer></script>
  <script>
    (function() {
      var msg = document.getElementById('successMsg');
      var btn = document.getElementById('successBtn');

      var urlParams  = new URLSearchParams(window.location.search);
      var orderId    = urlParams.get('order')       || '';
      var token      = urlParams.get('token')       || '';
      var paymentId  = urlParams.get('payment_id')  || urlParams.get('collection_id') || '';

      function unlockCourse(courseName, user) {
        if (!courseName) return;
        if (typeof agregarCursoAUsuario === 'function') {
          agregarCursoAUsuario(courseName, user || localStorage.getItem('usuario') || '');
        }
        localStorage.removeItem('checkoutInfo');
        if (msg) {
          msg.innerHTML = 'Tu pago fue procesado correctamente. El curso <strong>' +
            String(courseName).replace(/</g, '&lt;') + '</strong> ya fue agregado a tu cuenta.';
        }
        if (btn) {
          btn.textContent = 'Ir a Mis Cursos';
          btn.href = 'perfil.html#mis-cursos';
        }
      }

      function showPending() {
        if (msg) {
          msg.innerHTML = 'El pago todavía no aparece como aprobado. No se ha desbloqueado ningún curso. Puedes volver a tu perfil y revisar el estado más tarde.';
        }
        if (btn) {
          btn.textContent = 'Ir a mi perfil';
          btn.href = 'perfil.html';
        }
      }

      // Access is granted only after the server confirms the Mercado Pago status.
      if (orderId && token) {
        var statusUrl = '/api/payments/status?order=' + encodeURIComponent(orderId) +
          '&token=' + encodeURIComponent(token) +
          (paymentId ? '&payment_id=' + encodeURIComponent(paymentId) : '');

        var attempts = 0;
        var maxAttempts = 5;
        var checkStatus = function() {
          fetch(statusUrl)
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.status === 'approved' && data.productName) {
                unlockCourse(data.productName, localStorage.getItem('usuario') || '');
                return;
              }
              attempts += 1;
              if (attempts < maxAttempts) window.setTimeout(checkStatus, 3000);
              else showPending();
            })
            .catch(function() {
              attempts += 1;
              if (attempts < maxAttempts) window.setTimeout(checkStatus, 3000);
              else showPending();
            });
        };

        checkStatus();
      } else {
        showPending();
      }
    })();
  </script>
</body>
</html>
