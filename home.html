<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .btn-invitado {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 1000;
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.2s;
        }
        .btn-invitado:hover {
            background: #334155;
        }
    </style>

</head>

<body>
    <button class="btn-invitado" onclick="entrarComoInvitado()">Echa un vistazo</button>

<div class="login-container fade-in">
    <h1>Iniciar Sesión</h1>

    <p id="loginMsg" class="registro-msg"></p>

    <input type="text" id="user" placeholder="Usuario o correo electrónico">
    <div class="password-field">
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="password-toggle" type="button" onclick="alternarVisibilidadPassword('pass', this)" aria-label="Mostrar contraseña" aria-pressed="false">
            <span aria-hidden="true">👁</span>
        </button>
    </div>


    <button onclick="login()">Entrar</button>

    <p>¿Olvidaste tu contraseña? <a href="#" onclick="mostrarRecuperar()">Recuperar</a></p>

    <!-- Formulario de recuperación de contraseña -->
    <div id="recuperar-form" style="display:none; margin-top:15px;">
        <input type="email" id="recuperarEmail" placeholder="Ingresa tu correo electrónico">
        <button onclick="recuperarContrasena()">Enviar código</button>
    </div>

    <div id="recuperacionSection" class="verificacion-section" style="display:none;">
        <h3>Recuperar contraseña</h3>
        <p>Te enviamos un código a tu correo. Escríbelo y define tu nueva contraseña.</p>
        <input type="text" id="codigoRecuperacion" placeholder="Código de recuperación">
        <div class="password-field">
            <input type="password" id="nuevaPassword" placeholder="Nueva contraseña">
            <button class="password-toggle" type="button" onclick="alternarVisibilidadPassword('nuevaPassword', this)" aria-label="Mostrar nueva contraseña" aria-pressed="false">
                <span aria-hidden="true">👁</span>
            </button>
        </div>
        <div class="password-field">
            <input type="password" id="confirmarPassword" placeholder="Confirmar nueva contraseña">
            <button class="password-toggle" type="button" onclick="alternarVisibilidadPassword('confirmarPassword', this)" aria-label="Mostrar confirmación de contraseña" aria-pressed="false">
                <span aria-hidden="true">👁</span>
            </button>
        </div>
        <div class="verify-actions">
            <button type="button" onclick="restablecerContrasena()">Cambiar contraseña</button>
            <button type="button" class="btn-sec" onclick="reenviarCodigoRecuperacion()">Reenviar código</button>
        </div>
    </div>

    <p>¿No tienes cuenta?</p>
    <a href="registro.html">Crear cuenta</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init({ publicKey: "lcpwVT5dW109ewCDq" });</script>
<script src="app.js" defer></script>

</body>
</html>
