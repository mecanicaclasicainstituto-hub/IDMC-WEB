<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Insignia - IDMC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 36px rgba(15,23,42,0.1);
            padding: 34px 30px;
            text-align: center;
        }
        .logo { width: 56px; height: auto; margin-bottom: 14px; }
        .institute { font-size: 0.78rem; font-weight: 600; color: #64748b; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 18px; }
        .badge-icon { margin-bottom: 10px; display: flex; justify-content: center; }
        .verified-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: #dcfce7; color: #16a34a; font-weight: 700; font-size: 0.78rem;
            padding: 4px 14px; border-radius: 999px; margin-bottom: 18px;
        }
        h1 { font-size: 1.25rem; color: #0f172a; margin-bottom: 4px; }
        .modulo-titulo { font-size: 0.92rem; color: #475569; margin-bottom: 22px; }
        .datos { text-align: left; border-top: 1px solid #f1f5f9; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
        .dato-row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.86rem; }
        .dato-label { color: #94a3b8; }
        .dato-value { color: #0f172a; font-weight: 600; text-align: right; }
        .invalid-icon { font-size: 3rem; margin-bottom: 12px; }
        .invalid-title { color: #dc2626; font-size: 1.1rem; margin-bottom: 8px; }
        .invalid-desc { color: #64748b; font-size: 0.9rem; line-height: 1.6; }
        .back-link { display: inline-block; margin-top: 24px; font-size: 0.85rem; color: #2563eb; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card" id="appCard">Cargando...</div>

<script>
(function () {
    var SALT = 'IDMC-INSIGNIA-2026';
    var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function firmaInsignia(texto) {
        var h = 0x811c9dc5;
        for (var i = 0; i < texto.length; i++) {
            h ^= texto.charCodeAt(i);
            h = Math.imul(h, 0x01000193);
        }
        return (h >>> 0).toString(16);
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatearFecha(fechaISO) {
        var partes = String(fechaISO || '').split('-');
        if (partes.length !== 3) return fechaISO;
        var y = Number(partes[0]), m = Number(partes[1]), d = Number(partes[2]);
        if (!y || !m || !d || !MESES[m - 1]) return fechaISO;
        return d + ' de ' + MESES[m - 1] + ' de ' + y;
    }

    function render() {
        var params = new URLSearchParams(window.location.search);
        var curso = params.get('curso') || '';
        var modulo = params.get('modulo') || '';
        var titulo = params.get('titulo') || '';
        var nombre = params.get('nombre') || '';
        var fecha = params.get('fecha') || '';
        var sig = params.get('sig') || '';

        var card = document.getElementById('appCard');

        var esperado = 'mecanica_nivel1|' + modulo + '|' + nombre + '|' + fecha + '|' + SALT;
        var valido = curso && modulo && nombre && fecha && sig && firmaInsignia(esperado) === sig;

        if (!valido) {
            card.innerHTML =
                '<div class="invalid-icon">⚠️</div>' +
                '<div class="invalid-title">Insignia no válida</div>' +
                '<p class="invalid-desc">No pudimos verificar esta insignia. El enlace puede estar incompleto o haber sido alterado.</p>' +
                '<a class="back-link" href="index.html">Ir al inicio de IDMC</a>';
            return;
        }

        card.innerHTML =
            '<img class="logo" src="Icono IDMC.png" alt="IDMC">' +
            '<p class="institute">Instituto de Mecánica Clásica</p>' +
            '<div class="badge-icon">' +
                '<svg width="64" height="64" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
                    '<defs><linearGradient id="mgVerify" x1="0" y1="0" x2="1" y2="1">' +
                        '<stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#c8952e"/>' +
                    '</linearGradient></defs>' +
                    '<path d="M14 24 L7 43 L24 35 L41 43 L34 24" fill="#60a5fa"/>' +
                    '<circle cx="24" cy="19" r="15" fill="url(#mgVerify)" stroke="#8a5a12" stroke-width="1.4"/>' +
                    '<path d="M24 10.5l2.47 5.02 5.53.8-4 3.9.94 5.5L24 22.98l-4.94 2.74.94-5.5-4-3.9 5.53-.8z" fill="#fff"/>' +
                '</svg>' +
            '</div>' +
            '<div class="verified-pill">✓ Insignia verificada</div>' +
            '<h1>' + escapeHtml(nombre) + '</h1>' +
            '<p class="modulo-titulo">Completó el Módulo ' + escapeHtml(modulo) + ': ' + escapeHtml(titulo) + '</p>' +
            '<div class="datos">' +
                '<div class="dato-row"><span class="dato-label">Curso</span><span class="dato-value">' + escapeHtml(curso) + '</span></div>' +
                '<div class="dato-row"><span class="dato-label">Fecha</span><span class="dato-value">' + formatearFecha(fecha) + '</span></div>' +
                '<div class="dato-row"><span class="dato-label">Institución</span><span class="dato-value">IDMC</span></div>' +
            '</div>' +
            '<a class="back-link" href="cursos.html">Conoce nuestros cursos →</a>';
    }

    window.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
