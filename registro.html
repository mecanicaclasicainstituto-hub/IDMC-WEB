<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .btn-invitado {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 1000;
            background: #0f172a;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.2s;
        }
        .btn-invitado:hover {
            background: #334155;
        }
    </style>

</head>

<body>
    <button class="btn-invitado" onclick="entrarComoInvitado()">Echa un vistazo</button>

<div class="login-container fade-in">
    <h1>Crear Cuenta</h1>

    <p id="registroMsg" class="registro-msg"></p>

    <input type="text" id="user" placeholder="Nuevo usuario">
    <input type="email" id="email" placeholder="Correo electrónico">
    <div class="password-field">
        <input type="password" id="pass" placeholder="Nueva contraseña">
        <button class="password-toggle" type="button" onclick="alternarVisibilidadPassword('pass', this)" aria-label="Mostrar contraseña" aria-pressed="false">
            <span aria-hidden="true">👁</span>
        </button>
    </div>


    <button onclick="registrar()">Registrarse</button>

    <div id="verificacionSection" class="verificacion-section" style="display:none;">
        <h3>Verificar correo</h3>
        <p>Ingresa el código que te enviamos por correo para completar tu cuenta.</p>
        <input type="text" id="codigoVerificacion" placeholder="Código de 6 dígitos">
        <div class="verify-actions">
            <button type="button" onclick="verificarCodigoRegistro()">Verificar código</button>
            <button type="button" class="btn-sec" onclick="reenviarCodigoRegistro()">Reenviar código</button>
        </div>
    </div>

    <p>¿Ya tienes cuenta?</p>
    <a href="home.html">Iniciar sesión</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init({ publicKey: "lcpwVT5dW109ewCDq" });</script>
<script src="app.js" defer></script>
</body>
</html>
