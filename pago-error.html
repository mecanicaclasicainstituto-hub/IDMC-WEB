<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago rechazado - IDMC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff1f2, #ffe4e6);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #fecaca;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(220,38,38,0.10);
    }
    .icon-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #dc2626, #ef4444);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(220,38,38,0.28);
      color: #fff;
      font-weight: 800;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #7f1d1d;
      margin-bottom: 10px;
    }
    p {
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      padding: 13px 30px;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 4px 14px rgba(220,38,38,0.30);
      transition: opacity 0.2s;
      cursor: pointer;
      border: none;
      font-family: 'Poppins', sans-serif;
    }
    .btn:hover { opacity: 0.88; }
    .btn-sec {
      display: inline-block;
      margin-top: 12px;
      color: #64748b;
      font-size: 0.82rem;
      text-decoration: none;
    }
    .btn-sec:hover { color: #1e293b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">✕</div>
    <h1>Pago no completado</h1>
    <p>No pudimos procesar tu pago. Esto puede deberse a fondos insuficientes, datos incorrectos o una conexión inestable. Intenta de nuevo.</p>
    <button class="btn" onclick="history.back()">Intentar de nuevo</button>
    <br>
    <a class="btn-sec" href="cursos.html">Volver a cursos</a>
  </div>
</body>
</html>
