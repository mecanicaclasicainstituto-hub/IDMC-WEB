<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Instituto de Mecánica Clásica</title>
    <!-- Preload del logo para que el navegador lo descargue antes de renderizar -->
    <link rel="preload" href="Icono IDMC.png" as="image">
    <!-- Poppins font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Todo el CSS crítico inline: cero peticiones bloqueantes -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; scrollbar-width: none; }
        html::-webkit-scrollbar { display: none; }
        body { font-family: 'Poppins', system-ui, -apple-system, sans-serif; }
        .hero {
            min-height: 100vh;
            background: #e8eef5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .hero img {
            width: min(180px, 42vw);
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
        }
        .hero h1 {
            color: #0f172a;
            font-size: clamp(2rem, 6vw, 52px);
            font-weight: 900;
            margin-bottom: 12px;
            line-height: 1.15;
            text-shadow: 0 2px 12px rgba(0,0,0,0.13), 0 1px 3px rgba(0,0,0,0.10);
        }
        .hero p {
            color: #64748b;
            font-size: clamp(15px, 4vw, 18px);
            margin-bottom: 40px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .hero button {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.18s ease, transform 0.12s ease;
        }
        .hero button:hover { background: #1d4ed8; }
        .hero button:active { transform: scale(0.97); }
        @media (max-width: 480px) { .hero button { width: 80vw; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { opacity: 0; animation: fadeIn 0.7s ease 0.05s forwards; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
        .hero img { animation: float 3.5s ease-in-out infinite; }
    </style>
</head>
<body>
<div class="hero fade-in">
    <img src="Icono IDMC.png" alt="Instituto de Mecánica Clásica" fetchpriority="high" decoding="async" width="180">
    <h1>Instituto de Mecánica Clásica</h1>
    <p>Formación profesional en física e ingeniería</p>
    <button onclick="location.href='lobby.html'">Lobby</button>
</div>
</body>
</html>
