<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado de Finalización - IDMC</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        /* ── Botones acción ── */
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.18s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #e2e8f0; color: #1e293b; }
        .btn-secondary:hover { background: #cbd5e1; }

        /* ── Certificado ── */
        .cert-wrap {
            width: 100%;
            max-width: 820px;
        }

        .certificate {
            background: #fff;
            border: 2px solid #c8a95a;
            border-radius: 4px;
            padding: 56px 64px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 40px rgba(0,0,0,0.12);
        }

        /* Marco decorativo interior */
        .certificate::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(200, 169, 90, 0.4);
            border-radius: 2px;
            pointer-events: none;
        }

        .cert-logo {
            width: 70px;
            height: auto;
            margin-bottom: 6px;
        }

        .cert-institute {
            font-size: 0.85rem;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .cert-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            color: #0f172a;
            margin-bottom: 24px;
            line-height: 1.2;
        }

        .cert-otorga {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        .cert-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.5rem, 5vw, 2.6rem);
            color: #1e3a8a;
            border-bottom: 2px solid #c8a95a;
            display: inline-block;
            padding-bottom: 6px;
            margin-bottom: 24px;
            min-width: 300px;
        }

        .cert-desc {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.7;
            max-width: 520px;
            margin: 0 auto 32px;
        }

        .cert-course {
            font-weight: 700;
            color: #0f172a;
        }

        .cert-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            gap: 24px;
        }

        .cert-date {
            text-align: center;
        }
        .cert-date span {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .cert-date strong {
            font-size: 0.95rem;
            color: #1e293b;
        }

        .cert-firma {
            text-align: center;
        }
        .cert-firma img {
            width: 60px;
            height: auto;
            display: block;
            margin: 0 auto 0;
            mix-blend-mode: multiply;
        }
        .cert-firma-line {
            width: 200px;
            border-top: 1.5px solid #334155;
            margin: 0 auto 6px;
        }
        .cert-firma p {
            font-size: 0.85rem;
            color: #1e293b;
            font-weight: 600;
        }
        .cert-firma small {
            font-size: 0.75rem;
            color: #64748b;
        }

        .cert-sello {
            text-align: right;
        }
        .cert-sello img {
            width: 64px;
            opacity: 0.35;
        }
        .cert-felicidades p {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1rem;
            color: #c8a95a;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* ── Bloqueado ── */
        .locked-msg {
            text-align: center;
            padding: 48px 24px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            max-width: 480px;
        }
        .locked-msg h2 { font-size: 1.2rem; color: #0f172a; margin-bottom: 10px; }
        .locked-msg p { color: #64748b; font-size: 0.95rem; line-height: 1.6; }

        /* ── Print ── */
        @media print {
            @page { margin: 0; size: A4 portrait; }
            html, body {
                margin: 0;
                padding: 0;
                background: #fff;
                width: 100%;
                height: 100%;
            }
            .actions { display: none !important; }
            /* Ocultar botones flotantes al imprimir */
            #_calc_toggle, #_calc_panel,
            #_chat_toggle, #_chat_panel,
            #_cc_toggle, #_cc_panel { display: none !important; }
            .cert-wrap {
                max-width: 100%;
                width: 100%;
                height: 100vh;
            }
            .certificate {
                box-shadow: none;
                border: 2px solid #c8a95a;
                height: 100vh;
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                border-radius: 0;
                padding: 40px 80px;
            }
            .certificate::before {
                inset: 12px;
            }
        }

        @media (max-width: 600px) {
            .certificate { padding: 36px 24px; }
            .cert-bottom { flex-direction: column; align-items: center; text-align: center; }
            .cert-date { text-align: center; }
            .cert-sello { text-align: center; }
        }
    </style>
</head>
<body>

<div id="appContent"></div>

<script src="app.js" defer></script>
<script>
(function () {
    var CURSO_ID = 'mecanica_nivel1';
    var CURSO_NOMBRE = 'Mecánica Clásica Nivel I';

    function getNombreAlumno() {
        // Intenta obtener nombre completo guardado en perfil
        var nombre = localStorage.getItem('nombreCompleto')
            || localStorage.getItem('nombre')
            || localStorage.getItem('sesionUsuario')
            || localStorage.getItem('usuario')
            || '';
        return nombre.trim();
    }

    function getFechaHoy() {
        var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        var d = new Date();
        return d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
    }

    function cursoCompleto() {
        if (typeof getContinuarSesionUrl !== 'function') return false;
        // Si todas las sesiones están completadas, getContinuarSesionUrl devuelve el ejercicio final
        var url = getContinuarSesionUrl(CURSO_ID);
        return url === 'modulo3_ejercicio4.html';
    }

    function renderCertificado() {
        var nombre = getNombreAlumno() || 'Alumno';
        var fecha = getFechaHoy();

        document.getElementById('appContent').innerHTML =
            '<div class="actions">' +
                '<button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>' +
                '<a href="nivel1.html" class="btn btn-secondary">← Volver al curso</a>' +
            '</div>' +
            '<div class="cert-wrap">' +
                '<div class="certificate">' +
                    '<img src="Icono IDMC.png" alt="IDMC" class="cert-logo">' +
                    '<p class="cert-institute">Instituto de Mecánica Clásica</p>' +
                    '<h1 class="cert-title">Certificado de Finalización</h1>' +
                    '<p class="cert-otorga">Se otorga el presente certificado a:</p>' +
                    '<div class="cert-name" id="certNombre">' + nombre + '</div>' +
                    '<p class="cert-desc">Por haber completado exitosamente el curso<br>' +
                        '<span class="cert-course">' + CURSO_NOMBRE + '</span>,<br>' +
                        'demostrando dedicación y comprensión de los fundamentos de la mecánica clásica.' +
                    '</p>' +
                    '<div class="cert-bottom">' +
                        '<div class="cert-date">' +
                            '<span>Fecha de finalización</span>' +
                            '<strong>' + fecha + '</strong>' +
                        '</div>' +
                        '<div class="cert-firma">' +
                            '<img src="firma.png" alt="Firma">' +
                            '<div class="cert-firma-line"></div>' +
                            '<p>ING. Aaron Antonio Gordillo López</p>' +
                            '<small>Director General y Fundador</small>' +
                        '</div>' +
                        '<div class="cert-felicidades">' +
                            '<p>¡Felicidades por tu logro!</p>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
    }

    function renderBloqueado() {
        document.getElementById('appContent').innerHTML =
            '<div class="locked-msg">' +
                '<h2>🔒 Certificado no disponible</h2>' +
                '<p>Debes completar todas las sesiones del curso <strong>' + CURSO_NOMBRE + '</strong> para obtener tu certificado.</p>' +
                '<br>' +
                '<a href="nivel1.html" class="btn btn-primary" style="margin-top:8px;">Continuar curso</a>' +
            '</div>';
    }

    window.addEventListener('DOMContentLoaded', function () {
        if (cursoCompleto()) {
            renderCertificado();
        } else {
            renderBloqueado();
        }
    });
})();
</script>
</body>
</html>
