<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 428" role="img" aria-label="Logo Instituto de Mecánica Clásica">
  <style>
    .swing {
      transform-origin: 107px 364px;
      animation: pendulum 2.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
    }
    @keyframes pendulum {
      0%   { transform: rotate(-11deg); }
      100% { transform: rotate(6deg);  }
    }
  </style>

  <!-- Ground line (fixed) -->
  <line x1="18" y1="402" x2="472" y2="402"
        stroke="#111827" stroke-width="9" stroke-linecap="round"/>

  <!-- Wheel sitting ON top of ground (r=38, center = ground - radius) -->
  <circle cx="107" cy="364" r="38"
          fill="#2563eb" stroke="#111827" stroke-width="9"/>

  <!-- Rod + arrowhead swing together around circle CENTER -->
  <g class="swing">
    <!-- Black part of rod: from circle EDGE to ~45% of rod -->
    <line x1="133" y1="337" x2="206" y2="262"
          stroke="#111827" stroke-width="14" stroke-linecap="round"/>
    <!-- Blue part of rod: from 45% to arrowhead base -->
    <line x1="206" y1="262" x2="294" y2="170"
          stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
    <!-- Arrowhead (blue triangle) -->
    <polygon points="329,134  316,192  272,150" fill="#2563eb"/>
  </g>
</svg>
